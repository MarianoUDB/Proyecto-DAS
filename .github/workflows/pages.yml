name: Publicar simulador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias de desarrollo
        run: python -m pip install -e . pytest
      - name: Preparar motor para el navegador
        run: python build_web.py
      - name: Comprobar Python e interfaz
        run: python -m pytest tests -q
      - name: Comprobar reproducción
        run: node --test tests/test_playback.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
